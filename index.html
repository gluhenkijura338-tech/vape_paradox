
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090711">
<title>VAPE_PARADOX</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(ellipse at 50% 20%, #35105c 0%, transparent 55%),
    #090711;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  overflow-x: hidden;
}

.container {
  width: 100%;
  max-width: 480px;
  text-align: center;
  padding: 45px 25px;
  border: 1px solid rgba(190, 100, 255, 0.4);
  border-radius: 25px;
  background: rgba(15, 10, 27, 0.85);
  box-shadow: 0 0 45px rgba(145, 40, 255, 0.2);
  animation: appear 1s ease;
}

.logo {
  font-size: 65px;
  margin-bottom: 20px;
  filter: drop-shadow(0 0 18px #a855f7);
}

h1 {
  font-size: clamp(30px, 9vw, 42px);
  letter-spacing: 3px;
  color: #d9a4ff;
  text-shadow: 0 0 20px #a855f7;
  margin-bottom: 15px;
}

.line {
  width: 90px;
  height: 3px;
  background: #b45cff;
  margin: 20px auto;
  box-shadow: 0 0 15px #b45cff;
}

.description {
  color: #c6b9d5;
  font-size: 16px;
  line-height: 1.7;
  margin-bottom: 30px;
}

.telegram {
  display: inline-block;
  width: 100%;
  padding: 17px;
  border-radius: 14px;
  background: linear-gradient(90deg, #7926c9, #b44cff);
  color: white;
  text-decoration: none;
  font-weight: bold;
  font-size: 17px;
  box-shadow: 0 0 25px rgba(168, 85, 247, 0.35);
  transition: 0.3s;
}

.telegram:hover {
  transform: scale(1.04);
  box-shadow: 0 0 35px #a855f7;
}

.footer {
  color: #71647e;
  font-size: 12px;
  margin-top: 35px;
  letter-spacing: 2px;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(25px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>
</head>

<body>
  <main class="container">
    <div class="logo">✦</div>

    <h1>VAPE_PARADOX</h1>

    <div class="line"></div>

    <p class="description">
      Ласкаво просимо на офіційну сторінку
      VAPE_PARADOX.
      <br>
      Тут розміщені новини та посилання на наш канал.
    </p>

    <a class="telegram"
       href="https://t.me/biznecz_paradoxxx"
       target="_blank"
       rel="noopener noreferrer">
       ✈ ПЕРЕЙТИ В TELEGRAM
    </a>

    <div class="footer">
      VAPE_PARADOX © 2026
    </div>
  </main>
</body>
</html>
